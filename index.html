<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة توصيفات المقررات</title><style>
:root{--navy:#174a78;--blue:#2674a8;--bg:#f4f7fb;--card:#fff;--text:#172235;--muted:#64748b;--line:#dbe4ef;--warn:#b45309;--ok:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:34px 18px;text-align:center}header h1{margin:0 0 8px;font-size:clamp(24px,4vw,38px)}header p{margin:0;opacity:.9}main{max-width:1050px;margin:-20px auto 40px;padding:0 16px}.panel{background:white;border-radius:18px;box-shadow:0 10px 30px #163d6620;padding:20px}label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:white}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#eef5fb;border-radius:14px;padding:15px;text-align:center}.stat strong{display:block;font-size:25px;color:var(--navy)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}#cards{display:grid;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 15px #1722350a}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.code{direction:ltr;display:inline-block;background:#e8f2fb;color:var(--navy);padding:6px 10px;border-radius:9px;font-weight:700}h2{margin:8px 0 12px;font-size:20px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tag{background:#f1f5f9;border-radius:999px;padding:6px 10px;font-size:13px}.status{font-weight:700}.status.warn{color:var(--warn)}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}details{border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--navy);font-weight:700}.comments{white-space:pre-wrap;line-height:1.8;margin-top:12px;background:#fafcff;border-radius:10px;padding:14px}.empty{text-align:center;padding:40px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:20px}@media(max-width:650px){.filters,.stats{grid-template-columns:1fr}.top{display:block}}
</style></head><body><header><h1>متابعة ملاحظات توصيفات المقررات</h1><p>برنامج علوم الحاسب</p></header><main><section class="panel"><div class="filters"><div><label for="staff">اختر اسم عضو هيئة التدريس</label><select id="staff"><option value="">اختر الاسم...</option></select></div><div><label for="search">بحث في المقررات</label><input id="search" placeholder="الكود أو اسم المقرر"></div></div><div class="stats"><div class="stat"><strong id="total">0</strong>عدد المقررات</div><div class="stat"><strong id="needs">0</strong>تحتاج تعديلات</div><div class="stat"><strong id="approved">0</strong>معتمدة</div></div><div class="toolbar"><strong id="heading">يرجى اختيار الاسم</strong><small id="updated"></small></div><div id="cards"><div class="empty">جاري تحميل البيانات...</div></div></section></main><footer>صفحة عامة لعرض ملاحظات توصيفات المقررات.</footer><script>
let DATA=[];const staff=document.getElementById('staff'),search=document.getElementById('search'),cards=document.getElementById('cards');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function cls(s){if((s||'').includes('تعديلات'))return'warn';if((s||'').includes('اعتماد'))return'ok';if((s||'').includes('لم تبدأ'))return'bad';return''}function render(){let n=staff.value,q=search.value.trim().toLowerCase(),a=DATA.filter(x=>x.staff===n&&(!q||(x.code+' '+x.course).toLowerCase().includes(q)));total.textContent=a.length;needs.textContent=a.filter(x=>x.review.includes('تعديلات')).length;approved.textContent=a.filter(x=>x.review.includes('اعتماد')).length;heading.textContent=n||'يرجى اختيار الاسم';if(!n){cards.innerHTML='<div class="empty">اختر اسمًا لعرض المقررات والملاحظات.</div>';return}if(!a.length){cards.innerHTML='<div class="empty">لا توجد مقررات مطابقة.</div>';return}cards.innerHTML=a.map(x=>`<article class="card"><div class="top"><div><span class="code">${esc(x.code)}</span><h2>${esc(x.course)}</h2></div><span class="status ${cls(x.review)}">${esc(x.review||'لم تبدأ')}</span></div><div class="meta"><span class="tag">الترم: ${esc(x.term||'-')}</span><span class="tag">التصنيف: ${esc(x.category||'-')}</span><span class="tag">الاستلام: ${esc(x.receipt||'-')}</span>${x.reviewDate?`<span class="tag">تاريخ المراجعة: ${esc(x.reviewDate)}</span>`:''}</div><details ${x.comments?'':'open'}><summary>${x.comments?'عرض الملاحظات والإجراءات المطلوبة':'لا توجد ملاحظات مسجلة'}</summary>${x.comments?`<div class="comments">${esc(x.comments)}</div>`:''}</details></article>`).join('')}async function load(){try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);DATA=await r.json();[...new Set(DATA.map(x=>x.staff))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar')).forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;staff.appendChild(o)});updated.textContent='تم تحميل أحدث البيانات';cards.innerHTML='<div class="empty">اختر اسمًا لعرض المقررات والملاحظات.</div>'}catch(e){cards.innerHTML='<div class="empty">تعذر تحميل البيانات. أعد تحميل الصفحة.</div>'}}staff.addEventListener('change',render);search.addEventListener('input',render);load();
</script></body></html>
